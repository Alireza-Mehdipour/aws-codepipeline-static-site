name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run project tests
        run: bash tests/app.test.sh

      - name: Check Python syntax
        run: python -m py_compile scripts/inject_version.py
